name: Build and Release behradNG

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - '[0-9]*'
    paths-ignore:
      - '.github/workflows/release-metadata.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. 3.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      APP_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APP_KEYSTORE_PASSWORD || '' }}
      APP_KEYSTORE_ALIAS: ${{ github.event_name != 'pull_request' && secrets.APP_KEYSTORE_ALIAS || '' }}
      APP_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APP_KEY_PASSWORD || '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Checkout Xray source
      uses: actions/checkout@v4
      with:
        repository: 2dust/AndroidLibXrayLite
        path: AndroidLibXrayLite
        fetch-depth: 1

    - name: Checkout pinned HEV source
      uses: actions/checkout@v4
      with:
        repository: heiher/hev-socks5-tunnel
        ref: d9dca26c7ad0e494492244f0309e80ee583e739e
        path: hev-socks5-tunnel
        submodules: 'recursive'
        fetch-depth: 1

    - name: Restore persistent release signing key
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      run: |
        for SECRET_NAME in APP_KEYSTORE_BASE64 APP_KEYSTORE_PASSWORD APP_KEYSTORE_ALIAS APP_KEY_PASSWORD; do
          if [ -z "${!SECRET_NAME}" ]; then
            echo "::error::Missing repository Actions secret: $SECRET_NAME"
            exit 1
          fi
        done
        SIGNING_FILE="$RUNNER_TEMP/behradNG-release.jks"
        printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_FILE"
        echo "BNG_SIGNING_KEYSTORE=$SIGNING_FILE" >> "$GITHUB_ENV"

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools ndk;29.0.14206865 ndk;30.0.16248370'

    - name: Resolve Android 37 SDK path
      shell: bash
      run: |
        # API 37 is published as android-37.0, but compileSdk = 37 resolves android-37.
        # Remove this alias once sdkmanager installs platforms;android-37 directly.
        if [ ! -d "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
          ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
        fi
        test -r "$ANDROID_HOME/platforms/android-37/android.jar"

    - name: Restore missing Gradle wrapper
      shell: bash
      run: |
        if [ ! -f V2rayNG/gradle/wrapper/gradle-wrapper.jar ]; then
          GRADLE_VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip/\1/p' V2rayNG/gradle/wrapper/gradle-wrapper.properties)
          test -n "$GRADLE_VERSION"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/gradle/gradle/v$GRADLE_VERSION/gradle/wrapper/gradle-wrapper.jar" -o V2rayNG/gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Determine Release Tag
      id: tag_step
      run: |
        if [ -n "${{ inputs.release_tag }}" ]; then
          TAG="${{ inputs.release_tag }}"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          TAG="${{ github.ref_name }}"
        else
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts)
          test -n "$VERSION_NAME"
          TAG="$VERSION_NAME"
        fi
        TAG="${TAG#v}"
        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
        echo "Release tag will be: $TAG"

    - name: Setup Go for pinned Xray source
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite/go.mod
        cache-dependency-path: AndroidLibXrayLite/go.sum

    - name: Build pinned Xray AAR
      working-directory: AndroidLibXrayLite
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      run: |
        go mod download
        MOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
        go install "golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION"
        mkdir -p assets data "$GITHUB_WORKSPACE/V2rayNG/app/libs"
        bash gen_assets.sh download
        cp data/*.dat assets/
        gomobile init
        gomobile bind -v -target=android -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o "$GITHUB_WORKSPACE/V2rayNG/app/libs/libv2ray.aar" ./
        for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
          unzip -l "$GITHUB_WORKSPACE/V2rayNG/app/libs/libv2ray.aar" "jni/$ABI/libgojni.so" | grep -F "jni/$ABI/libgojni.so"
        done

    - name: Build pinned HEV libraries
      env:
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
      run: |
        bash compile-hevtun.sh
        cp -a libs/. V2rayNG/app/libs/
        for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
          test -s "V2rayNG/app/libs/$ABI/libhev-socks5-tunnel.so"
          test -s "V2rayNG/app/libs/$ABI/libhevsockstun.so"
        done

    - name: Prepare pinned Aether core
      env:
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
      run: bash prepare-aether.sh

    - name: Prepare pinned Saturn core
      env:
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
      run: bash prepare-saturn.sh

    - name: Prepare pinned Iran routing datasets
      run: bash prepare-iran-rules.sh

    - name: Prepare behradNG project
      shell: bash
      run: |
        if [ ! -f V2rayNG/debug.keystore ]; then
          keytool -genkeypair -keystore V2rayNG/debug.keystore -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
        fi

    - name: Build APK with Gradle
      working-directory: V2rayNG
      run: |
        chmod +x gradlew
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug --stacktrace
        else
          ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleRelease --stacktrace
        fi

    - name: Select APK artifact
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "APK_FILE=V2rayNG/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          echo "APK_PACKAGE=com.v2ray.ang.behradng.debug" >> "$GITHUB_ENV"
          echo "APK_ARTIFACT=behradNG-${{ env.RELEASE_TAG }}-debug" >> "$GITHUB_ENV"
        else
          echo "APK_FILE=V2rayNG/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          echo "APK_PACKAGE=com.v2ray.ang.behradng" >> "$GITHUB_ENV"
          echo "APK_ARTIFACT=behradNG-${{ env.RELEASE_TAG }}" >> "$GITHUB_ENV"
        fi

    - name: Verify APK signature and package
      shell: bash
      run: |
        test -s "$APK_FILE"
        "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 24 "$APK_FILE"
        "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_FILE" | grep -F "package: name='$APK_PACKAGE'"

    - name: Verify APK native libraries
      shell: bash
      run: |
        test -s "$APK_FILE"
        for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
          for LIBRARY in libhev-socks5-tunnel.so libhevsockstun.so libgojni.so; do
            unzip -l "$APK_FILE" "lib/$ABI/$LIBRARY" | grep -F "lib/$ABI/$LIBRARY"
          done
        done
        for ABI in $(jq -r '.assets[].abi' aether-core.lock.json); do
          for LIBRARY in libaether-core.so libaether-launcher.so; do
            unzip -l "$APK_FILE" "lib/$ABI/$LIBRARY" | grep -F "lib/$ABI/$LIBRARY"
          done
        done
        unzip -l "$APK_FILE" assets/third_party/AETHER_LICENSE.txt | grep -F assets/third_party/AETHER_LICENSE.txt

    - name: Verify Saturn packaging
      shell: bash
      run: |
        unzip -l "$APK_FILE" assets/third_party/saturn/source-pins.json | grep -F source-pins.json
        unzip -l "$APK_FILE" assets/saturn/install-saturn.sh | grep -F install-saturn.sh
        unzip -l "$APK_FILE" assets/saturn/saturn-server-amd64 | grep -F saturn-server-amd64
        unzip -l "$APK_FILE" assets/saturn/saturn-server-arm64 | grep -F saturn-server-arm64
        for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
          unzip -l "$APK_FILE" "lib/$ABI/libsaturn.so" | grep -F "lib/$ABI/libsaturn.so"
        done

    - name: Verify bundled Iran datasets
      shell: bash
      run: |
        test -s "$APK_FILE"
        for FILE in geoip.dat geosite.dat; do
          EXPECTED=$(jq -r --arg file "$FILE" '.files[$file]' iran-rules.lock.json)
          ACTUAL=$(unzip -p "$APK_FILE" "assets/$FILE" | sha256sum | cut -d ' ' -f 1)
          test "$ACTUAL" = "$EXPECTED"
        done
        EXPECTED=$(jq -r .licenseSha256 iran-rules.lock.json)
        ACTUAL=$(unzip -p "$APK_FILE" assets/third_party/IRAN_RULES_LICENSE.txt | sha256sum | cut -d ' ' -f 1)
        test "$ACTUAL" = "$EXPECTED"

    - name: Prepare Release APK Artifact
      run: |
        mkdir -p release-apks
        if [ -f "$APK_FILE" ]; then
          cp "$APK_FILE" "release-apks/${{ env.APK_ARTIFACT }}.apk"
        else
          echo "No APK found at $APK_FILE!"
          exit 1
        fi
        if [ -d bin ]; then
          cp bin/saturn-* release-apks/ 2>/dev/null || true
        fi
        if [ -f install-saturn.sh ]; then
          cp install-saturn.sh release-apks/ 2>/dev/null || true
        fi
        ls -la release-apks/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APK_ARTIFACT }}
        path: release-apks/*

    - name: Publish to GitHub Releases
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "behradNG ${{ env.RELEASE_TAG }}"
        body: |
          # 🚀 behradNG ${{ env.RELEASE_TAG }}

          Fast & Secure V2Ray / Xray client for Android with native **Saturn Direct VPN Protocol** and ExpressVPN-inspired interface.

          ### 🆕 What's New in ${{ env.RELEASE_TAG }}
          - 🚀 **Irancell & Mobile Uplink MTU Fix**: Capped unencrypted payload chunk size per frame to `1220 bytes`, eliminating IP/TCP fragmentation over Irancell's tight Path MTU (~1360). Smart dynamic padding is only applied to small packets (< 400B) during initial handshakes; upload chunks are never bloated.
          - 📶 **High-Throughput smux & Multi-Session Connection Pool**: Configured smux with `MaxFrameSize = 1200`, `MaxReceiveBuffer = 8MB`, and `MaxStreamBuffer = 2MB`. `ClientPool` manages 2-4 active sessions with 3s stream open timeouts, automatic dead session eviction, and on-demand dial recovery on mobile NAT drops.
          - 🛡️ **Stealth TLS 1.3 Record Layer**: 100% RFC 8446 AEAD record framing (`0x17 0x03 0x03`) with directional client/server keys and IVs (`nonce = baseIV ^ seq`), producing uniform Shannon entropy (> 7.999) indistinguishable from genuine HTTPS, completely preventing deep packet inspection resets.
          - 📱 **Kernel MTU Probing & Socket Tuning**: Server installer adds sysctl rules for `tcp_mtu_probing = 1`, `tcp_base_mss = 1024`, and mobile keepalives. Android TUN interface MTU lowered to 1360 for Saturn.
          - ⚡ **Zero-Latency Connection Pre-Warming**: Pre-warms the primary smux tunnel before activating the local SOCKS5/HTTP inbound listener. Eliminates initial ping latency spikes and ensures connection tests succeed immediately on connection.
          - 🧹 **Zero Bloat & Legacy Cleanup**: Completely removed old URnetwork files and 48MB bloated binary (`liburnetwork.so`). Saturn is 100% lightweight native Go core (`libsaturn.so`).
          - 🏷️ **Clean UI**: Completely purged legacy quota badges ("30 GB Remaining") and URnetwork settings from server forms. Saturn now natively presents a clean, direct anti-DPI configuration and SSH deployment.

          ### ✨ Key Features
          - 🪐 **Saturn Direct VPN Protocol**: High-speed, DPI-resistant direct protocol featuring Zero-RTT stealth handshake in TLS 1.3 ClientHello (100% Google Chrome JA3/JA4 fingerprint compliant without custom extensions), standard TLS 1.3 Application Data record wrapping (0x17 0x03 0x03), bounded anti-replay cache, active probing spliced fallback (to `dl.google.com:443`), First-N-Packets dynamic padding (0-512 bytes), native smux v2 multiplexing, and hardware-accelerated ChaCha20-Poly1305 / AES-128-GCM binary framing.
          - 🚀 **One-Click SSH Server Provisioner**: Automated remote VPS server deployment for fresh Ubuntu/Debian over SSH directly from within the app.
          - 🎨 **ExpressVPN-Style Design**: Giant power button with glowing connected pulse aura, dynamic status banners, and location selector card.
          - ⚙️ **Multi-Protocol Support**: Saturn Direct, VLESS, VMess, Shadowsocks, Trojan, WireGuard, Hysteria2, SOCKS5, HTTP.
          - ⚡ **Real Ping & Speed Test**: One-tap latency test for all nodes or current server.
          - 🛡️ **Advanced Security**: Split tunneling (Per-App Proxy), Routing rules (Bypass LAN / Iran / Global), and Custom DNS.

          ### 📥 Download & Deployment
          - **Android Client**: Download the attached `behradNG-${{ env.RELEASE_TAG }}.apk` below and install it directly on your Android device (Android 7.0+).
          - **Linux Server Binaries**: Attached `saturn-server-linux-amd64` and `saturn-server-linux-arm64`.
          - **One-Line Server Installer**:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/dashbehrad/behradNG/main/install-saturn.sh | sudo bash
            ```

          ---
          *Automated Release from commit: ${{ github.sha }}*
        files: |
          release-apks/*
        draft: false
        prerelease: false
        make_latest: 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
